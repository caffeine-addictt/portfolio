[package]
name = "portfolio"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.89"
axum = "0.8.9"
chrono = "0.4.45"
tera = { version = "2.2.0", features = [
  "fast",
  "glob_fs",
  "unicode",
  "preserve_order",
] }
tokio = { version = "1.40.0", features = ["full"] }
tower = { version = "0.5.1", features = ["buffer", "limit"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
