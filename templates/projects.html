{% extends "layout.html"  %}


{% block content %}
<div class="mx-auto w-full sm:max-w-4xl px-6">
  <section class="pt-12">
    <div class="flex flex-col gap-4">
      <h1 class="text-5xl font-bold tracking-tight">my projects</h1>
      <p class="max-w-2xl text-lg leading-7 text-current/70">things i've built, broken, fixed, and occasionally shipped.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-10">
      {% for project in projects %}
      {{<project.card project={project} />}}
      {% endfor %}
    </div>
  </section>
</div>
{% endblock content %}
