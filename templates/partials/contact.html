{% if contact_result %}
  <div class="alert alert-success mt-10 max-w-2xl">
    <span>
      message sent — thanks for reaching out. I'll get back to you as soon as I can.
    </span>
  </div>
{% else %}
  <div class="alert alert-error mt-10 max-w-2xl">
    <span>
      something went wrong — please try again later.
    </span>
  </div>
{% endif %}
