<nav class="flex sticky top-0 z-50 h-16 w-full backdrop-blur-sm will-change-scroll">
  <div class="mx-auto mb-2 mt-4 flex size-full flex-row justify-between gap-5 self-center">

    {# left #}
    <div class="flex flex-row self-center gap-5 transition-color">
      {% <link url="/" class="link-hover text-current/70 hover:text-current"> %}home{% </link> %}
      {% <link url="/projects" class="link-hover text-current/70 hover:text-current"> %}projects{% </link> %}
      {% <link url="/blog" class="link-hover text-current/70 hover:text-current"> %}blog{% </link> %}
      {% <link url="/contact" class="link-hover text-current/70 hover:text-current"> %}contact{% </link> %}
    </div>

    {# right #}
    <div class="self-center">
      <label class="swap swap-rotate">
        <input type="checkbox" id="theme-toggle" />
        {{ <icon.sun class="swap-off fill-current"/> }}
        {{ <icon.moon class="swap-on fill-current"/> }}
      </label>
    </div>

    <script>
      const toggle = document.getElementById("theme-toggle");

      const theme =
        localStorage.getItem("theme") ??
        (window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light");
      document.documentElement.dataset.theme = theme;
      toggle.checked = theme === "dark";

      toggle.addEventListener("change", () => {
        const theme = toggle.checked ? "dark" : "light";

        document.documentElement.dataset.theme = theme;
        localStorage.setItem("theme", theme);
      });
    </script>

  </div>
</nav>
